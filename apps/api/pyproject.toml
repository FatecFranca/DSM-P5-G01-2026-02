[project]
name = "alfabetiza-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3", "argon2-cffi>=23.1,<26", "email-validator>=2.2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]
corpus = ["pandas>=2.2,<3", "openpyxl>=3.1,<4", "pyphen>=0.17,<1"]

[tool.hatch.build.targets.wheel.force-include]
"app/data/word_bank.json" = "app/data/word_bank.json"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
